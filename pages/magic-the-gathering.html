<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Magic the Gathering - Seriecentrum">
    <title>Magic the Gathering - Seriecentrum</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
        <div id="navbar-container"></div>
    <section class="page-section">
        <div class="page-container">
            <h1 class="page-title">Magic the Gathering</h1>
            <p class="page-description">Utforska vårt omfattande utbud av Magic: The Gathering produkter</p>
            
        </div>
    </section>
        <div id="footer-container"></div>
        <script src="../components/navbar.js"></script>
    <script>
        // Load footer
        (function() {
            const footerContainer = document.getElementById('footer-container');
            if (footerContainer) {
                const isInPages = window.location.pathname.includes('/pages/');
                const footerPath = isInPages ? '../components/footer.html' : 'components/footer.html';
                fetch(footerPath)
                    .then(response => response.text())
                    .then(html => {
                        footerContainer.innerHTML = html;
                    })
                    .catch(error => {
                        console.error('Error loading footer:', error);
                    });
            }
        })();
    </script>
    <script src="../script.js"></script>
</body>
</html>
